<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="apple-mobile-web-app-capable"
        content="yes">

  <meta name="apple-mobile-web-app-status-bar-style"
        content="black">

  <meta name="apple-mobile-web-app-title"
        content="One Barb Flight Pass">

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">

  <title>One Barb Flight Pass</title>
</head>

<body>
  <a id="passLink" href="#" style="font-size:24px;">
    Open My Flight Pass
  </a>

  <script>
    const params = new URLSearchParams(window.location.search);
    const member = params.get("member");
    const passLink = document.getElementById("passLink");

    if (member) {
      passLink.href =
        "https://script.google.com/macros/s/AKfycbxebqfzrvue9-tB9zo-x1SoDST0g9FeYxcds0yEB_ay8uSA41rJQU66-B52Dv275sZz/exec?member=" +
        encodeURIComponent(member);
    }
  </script>
</body>
</html>
