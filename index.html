<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="One Barb Flight Pass">

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">

  <title>One Barb Flight Pass</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #passLink {
      background: #f58220;
      color: white;
      text-decoration: none;
      padding: 16px 28px;
      border-radius: 10px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<a id="passLink" href="#">Open My Flight Pass</a>

<script>
const params = new URLSearchParams(window.location.search);
const member = params.get("member");

const deployment =
"https://script.google.com/macros/s/AKfycbxebqfzrvue9-tB9zo-x1SoDST0g9FeYxcds0yEB_ay8uSA41rJQU66-B52Dv275sZz/exec";

if(member){
    document.getElementById("passLink").href =
        deployment + "?member=" + encodeURIComponent(member);
}else{
    document.getElementById("passLink").href = deployment;
}
</script>

</body>
</html>
